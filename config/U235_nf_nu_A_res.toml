# Prompt neutron multiplicity per fragment against fragment mass, 235-U(n,f), resonance region.
#
# The companion U235_nf_nu_A.toml admits thermal incident neutrons only. The GELINA
# measurements are made on a resonance-neutron beam whose spectrum-averaged energy is about
# 580 eV, so a thermal window excludes them by their own terms. Widening the window to 1 keV
# admits those and nothing else.

[query]
target = "U-235"            # EXFOR nuclide symbol of the target
reaction = "n,f"            # one of: "n,f" | "0,f"
quantity = "NU"             # one of: "NU" | "FY" | "E" | "MFQ"
abscissa = "A"              # one of: "A" | "Ap" | "Z" | "ZAp" | "E" | "TKE" | "ATKE"
ordinate = "nu"             # one of: "nu" | "nuPair" | "yield" | "KE" | "KEp" | "TKE" | "TKEp" | "epsE" | "spectrum" | "spectrumRatioMXW"
energy_min = 0.0            # incident energy window, MeV, at least 0
energy_max = 1.0e-3         # incident energy window, MeV, above energy_min

[retrieval]
concurrency = 4             # simultaneous requests, 1 to 16
timeout = 60.0              # per-request timeout in seconds, positive
retries = 4                 # retry attempts after a failure, 0 to 10
backoff = 1.0               # base of the exponential backoff in seconds, positive
use_cache = true            # read and write the on-disk response cache
save_subentries = true      # store the original EXFOR subentry text beside the data

[output]
directory = "data/resonance"  # kept apart: the label does not encode the energy window, so a
                            # thermal and a resonance run of the same observable would otherwise
                            # differ only by a numeric suffix
digits = 7                  # decimals in tabulated output, 1 to 15
