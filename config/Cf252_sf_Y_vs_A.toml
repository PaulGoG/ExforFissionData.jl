# Pre-neutron mass yields of spontaneous fission of 252-Cf.

[query]
target_Z = 98           # atomic number of the target, 1 to 118
target_A = 252          # mass number of the target, at least target_Z and at most 300
channel = "sf"          # entrance channel, one of: "sf" | "nth" | "nres" | "nfast"
abscissa = ["mass"]     # quantities the observable is tabulated against; one of:
                        #   ["mass"] | ["product_mass"] | ["charge"] | ["neutron_energy"] |
                        #   ["total_kinetic_energy"] | ["charge", "product_mass"] |
                        #   ["mass", "total_kinetic_energy"]
ordinate = "yield"      # the observable; one of:
                        #   "yield" | "multiplicity" | "multiplicity_per_fission" |
                        #   "fragment_kinetic_energy" | "product_kinetic_energy" |
                        #   "total_kinetic_energy" | "post_neutron_total_kinetic_energy" |
                        #   "neutron_kinetic_energy" | "spectrum" |
                        #   "spectrum_maxwellian_ratio"

[retrieval]
concurrency = 4         # simultaneous requests, 1 to 16
timeout = 60.0          # per-request timeout in seconds, positive
retries = 4             # retry attempts after a failure, 0 to 10
backoff = 1.0           # base of the exponential backoff in seconds, positive
use_cache = true        # read and write the on-disk response cache
refresh = false         # refetch every response and replace the cached copy; needs use_cache, excludes offline
offline = false         # serve every response from the cache; needs use_cache, excludes refresh
save_subentries = true  # store the original EXFOR subentry text beside the data
# max_age_days = 30    # refetch cached dataset responses older than this many days, positive
# cache_directory = "" # response cache location; empty for the default scratch space

[output]
directory = "data"      # root for retrieved data, relative to the output root
significant_digits = 7  # significant digits in tabulated output, 1 to 15
# record_hostname = false # name the machine in the run record
