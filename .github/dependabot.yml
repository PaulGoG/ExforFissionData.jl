# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/docs"
      - "/formatter"
      - "/plotting"
      - "/test"
    schedule:
      interval: "weekly"
    # Dependabot reads no version for the standard libraries and rewrites their compat entries
    # to "1, < 0.0.1"; those entries are kept by hand.
    ignore:
      - dependency-name: "Dates"
      - dependency-name: "Statistics"
      - dependency-name: "TOML"
      - dependency-name: "Test"
    groups:
      julia-dependencies:
        patterns:
          - "*"
