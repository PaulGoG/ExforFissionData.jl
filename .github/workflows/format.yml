name: Format
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Check formatting against .JuliaFormatter.toml
        shell: julia --color=yes {0}
        run: |
          include(joinpath(pwd(), "formatter", "activate.jl"))
          using JuliaFormatter
          formatted = all(format(target; overwrite = false)
                          for target in ("src", "test", "scripts", "plotting", "docs", "check.jl"))
          if !formatted
              @error "Formatting differs from .JuliaFormatter.toml. Run `julia check.jl` locally."
              exit(1)
          end
